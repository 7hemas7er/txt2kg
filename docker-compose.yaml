# txt2kg - Uses host Ollama (port 11434) for LLM + Embeddings, Qdrant for vector search
services:
  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    container_name: txt2kg
    restart: unless-stopped
    ports:
      - '8091:3000'
    environment:
      # Graph DB
      - ARANGODB_URL=http://arangodb:8529
      - ARANGODB_DB=txt2kg
      - GRAPH_DB_TYPE=arangodb
      - NEO4J_URI=bolt://localhost:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      # LLM - Ollama locale (modelli ottimizzati)
      - OLLAMA_BASE_URL=http://192.168.0.26:11434/v1
      - OLLAMA_MODEL=nemoclaw-agent
      - VLLM_BASE_URL=http://localhost:8001/v1
      - VLLM_MODEL=disabled
      # Vector DB - Qdrant
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_DB_TYPE=qdrant
      # Embeddings - Ollama nomic-embed-text (768 dim)
      - EMBEDDINGS_API_URL=http://192.168.0.26:11434/v1
      - EMBEDDINGS_MODEL_ID=nomic-embed-text
      - EMBEDDINGS_PROVIDER=local
      # General
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_OPTIONS=--max-http-header-size=80000
      - UV_THREADPOOL_SIZE=128
      - HTTP_TIMEOUT=1800000
      - REQUEST_TIMEOUT=1800000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - qdrant-net
    depends_on:
      arangodb:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  arangodb:
    image: arangodb:latest
    container_name: txt2kg-arangodb
    restart: unless-stopped
    ports:
      - '8529:8529'
    environment:
      - ARANGO_NO_AUTH=1
    volumes:
      - arangodb_data:/var/lib/arangodb3
      - arangodb_apps_data:/var/lib/arangodb3-apps
    networks:
      - default

  arangodb-init:
    image: arangodb:latest
    depends_on:
      arangodb:
        condition: service_started
    restart: on-failure
    networks:
      - default
    entrypoint: >
      sh -c "
        echo 'Waiting for ArangoDB...' &&
        sleep 10 &&
        arangosh --server.endpoint tcp://arangodb:8529 --server.authentication false --javascript.execute-string 'try { db._createDatabase(\"txt2kg\"); print(\"Created txt2kg db\"); } catch(e) { print(\"DB exists\"); }'
      "

  # Qdrant - Vector search engine
  qdrant:
    image: qdrant/qdrant:latest
    container_name: txt2kg-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - qdrant-net

  # Qdrant init - Create collections with 768 dimensions (nomic-embed-text)
  qdrant-init:
    image: curlimages/curl:latest
    depends_on:
      - qdrant
    restart: "no"
    networks:
      - qdrant-net
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Waiting for Qdrant to start...'
        sleep 5
        curl -X PUT http://qdrant:6333/collections/entity-embeddings \
          -H 'Content-Type: application/json' \
          -d '{"vectors":{"size":768,"distance":"Cosine"}}' || true
        curl -X PUT http://qdrant:6333/collections/document-embeddings \
          -H 'Content-Type: application/json' \
          -d '{"vectors":{"size":768,"distance":"Cosine"}}' || true
        echo 'Collections created (768 dim for nomic-embed-text)'

volumes:
  arangodb_data:
  arangodb_apps_data:
  qdrant_data:

networks:
  default:
    driver: bridge
  qdrant-net:
    driver: bridge
